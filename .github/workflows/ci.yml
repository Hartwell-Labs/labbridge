name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Run translator tests
        run: ruby -Ilib test/labbridge_test.rb -v
      - name: End-to-end demo (translate + execute)
        run: bin/labbridge r2ruby examples/ransomware_score.rs --target talus | ruby

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ruby plugin -> Rust compiles against SDK contract
        run: |
          bin/labbridge r2rust examples/event_counter.rb -o /tmp/event_counter.rs
          grep -q "impl LabPlugin for EventCounter" /tmp/event_counter.rs
          grep -q 'const TARGET: &'"'"'static str = "talus"' /tmp/event_counter.rs
